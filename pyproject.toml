[project]
name = "nugets"
version = "0.1.0"
description = "NeUral GEomeTry — benchmarking neural networks on geometric tasks"
readme = "README.rst"
requires-python = ">=3.11,<3.12"

authors = [
    { name = "Tristan Brugère",  email="<tbrugere@ucsd.edu>" },
    { name = "Samantha Chen", email="<srchen98@gmail.com>" },
]

dependencies = [
    # Build/runtime utilities
    "setuptools>=75.8.0",

    # Core numerical and scientific stack
    "numpy>=1.26.4",
    "scipy>=1.15.1",
    "scikit-learn>=1.6",
    "networkx>=3.4",
    "matplotlib>=3.10",

    # PyTorch stack
    "torch==2.6.0+cu124",
    "torch-geometric>=2.6",
    "torch-scatter==2.1.2+pt26cu124",
    "lightning>=2.5.0.post0",

    # Geometry and optimal transport
    "pot>=0.9.5",
    "geomloss[full]>=0.2.6",
    "shapely>=2.1.1",
    "miniball>=1.2.0",
    "polygenerator>=0.2.0",
    "yupi>=1.0.2",
    "dtaidistance>=2.4.0",

    # Terrain and image processing
    "rasterio>=1.4.4",
    "opencv-python>=4.10",

    # Configuration and experiment management
    "pyyaml>=6.0.2",
    "pydantic>=2.10.6",
    "wandb>=0.19.6",

    # Storage and dataset access
    "huggingface-hub>=0.32.0",
    "google-cloud-storage>=3.1.0",
    "gcsfs>=2025.2.0",
    "fsspec[gcs]>=2025.2.0",

    # Project-specific dependencies
    "ml-lib",
    "torch-heterogeneous-batching",

    # Attention implementation
    "flash-attn==2.7.4.post1",
]


[dependency-groups]
doc = [
    "sphinx>=8.1.3",
    "sphinx-pyproject>=0.3.0",
    "sphinx-rtd-theme>=3.0.2",
]

dev = [
    "git-autocommit-hook>=0.1.2",
    "ruff>=0.9.3",
    "ruff-lsp>=0.0.60",
    "neovim",
    "setuptools",
    "ipython>=8.32.0",
    "ipykernel>=6.29",
]

test = [
    "pytest>=8.3.4",
]

build-tools = [
    "cython>=3.1.2",
    "numpy>=1.26.4",
    "poetry>=2.1.3",
    "psutil",
    "setuptools>=75.8.0",
    "torch==2.6.0+cu124",
]


[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.11'",
]


[tool.uv.sources]
torch = { index = "torch-cu124" }

torch-scatter = { url = "https://data.pyg.org/whl/torch-2.6.0%2Bcu124/torch_scatter-2.1.2%2Bpt26cu124-cp311-cp311-linux_x86_64.whl" }

ml-lib = { git = "https://github.com/tbrugere/ml_lib.git", rev = "devel"}

torch-heterogeneous-batching = {git = "https://github.com/tbrugere/pytorch_heterogeneous_batching.git",rev = "main"}

geomloss = {git = "https://github.com/tbrugere/geomloss",rev = "batching"}


[[tool.uv.index]]
name = "torch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true


[tool.uv.extra-build-dependencies]
torch-scatter = ["torch"]
flash-attn = [
    { requirement = "torch", match-runtime = true },
]


[[tool.uv.dependency-metadata]]
name = "flash-attn"
version = "2.7.4.post1"
requires-dist = [
    "torch",
    "einops",
]


[[tool.uv.dependency-metadata]]
name = "torch-scatter"
requires-dist = [
    "torch",
]


[tool.sphinx-pyproject]
extensions = [
    "sphinx.ext.autodoc",
    "sphinx.ext.napoleon",
    "sphinx.ext.viewcode",
    "sphinx.ext.autosummary",
    "sphinx_rtd_theme",
]

html_theme = "sphinx_rtd_theme"
html_static_path = ["_static"]


[tool.pyright]
venvPath = "."
venv = ".venv"


[tool.pytest.ini_options]
pythonpath = ["."]