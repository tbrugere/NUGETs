task:
  type: ExtremalPointRegressionTask
  dataset: GaussianBlobs
  dataset_config:
    length: 1000
    dim: 64
    min_points: 50
    max_points: 100
    centers: 4
  ood_dataset: GaussianBlobs
  ood_config:
    length: 10
    dim: 64
    min_points: 150
    max_points: 200
    centers: 4
backbone:
  type: QueryNetwork
  encoder:
    type: SetNN
    d_model: 64
    embedding_layers: 2
    embedding_hidden_dim: 128
batch_size: 64
learning_rate: 1.e-4
debug_mode: True
loss_function: mse_loss

