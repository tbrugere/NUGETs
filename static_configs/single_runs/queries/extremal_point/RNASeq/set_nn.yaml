task:
  type: ExtremalPointRegressionTask
  dataset: RNASeqPointCloud
  dataset_config:
    length: 1000
    size: 100
  ood_dataset: RNASeqPointCloud
  ood_config:
    length: 10
    size: 200
backbone:
  type: QueryNetwork
  encoder:
    type: SetNN
    d_model: 64
    embedding_layers: 2
    embedding_hidden_dim: 128
batch_size: 64
learning_rate: 1.e-4
debug_mode: True
loss_function: mse_loss

