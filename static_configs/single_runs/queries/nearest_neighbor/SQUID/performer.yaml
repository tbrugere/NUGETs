task:
  type: NearestNeighborIdentificationTask
  dataset: SQUIDBoundaries
  dataset_config:
    length: 100
    normalization: true
  ood_dataset: SQUIDBoundaries
  ood_config:
    length: 10
    normalization: true
backbone:
  type: QueryNetwork
  encoder:
    type: Performer
    n_heads: 2
    n_layers: 3
    d_model: 64
batch_size: 64
learning_rate: 0.0001
debug_mode: true
loss_function: mse_loss
