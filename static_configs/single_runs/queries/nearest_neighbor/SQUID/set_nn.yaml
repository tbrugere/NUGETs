task:
  type: NearestNeighborIdentificationTask
  dataset: SQUIDBoundaries
  dataset_config:
    length: 100
    normalization: true
  ood_dataset: SQUIDBoundaries
  ood_config:
    length: 10
    normalization: true
backbone:
  type: QueryNetwork
  encoder:
    type: SetNN
    d_model: 64
    embedding_layers: 2
    embedding_hidden_dim: 128
batch_size: 64
learning_rate: 0.0001
debug_mode: true
loss_function: mse_loss
