task:
  type: NearestNeighborIdentificationTask
  dataset: SQUIDBoundaries
  dataset_config:
    length: 100
    normalization: true
  ood_dataset: SQUIDBoundaries
  ood_config:
    length: 10
    normalization: true
backbone:
  type: QueryNetwork
  encoder:
    type: Linformer
    n_heads: 2
    n_layers: 3
    d_model: 64
    feed_forward_hidden_dim: 128
    max_seq_len: 315
    projection_dim: 32
batch_size: 64
learning_rate: 0.0001
debug_mode: true
loss_function: mse_loss
