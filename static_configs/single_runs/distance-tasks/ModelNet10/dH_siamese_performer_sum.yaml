task:
  type: HausdorffDistanceTask
  dataset: ModelNetPointset
  dataset_config:
    name: '10'
    size: 256
    length: 100
  ood_dataset: ModelNetPointset
  ood_config:
    name: '10'
    size: 512
    length: 100
backbone:
  type: CoupledNetwork
  latent_dimension: 32
  p: 1
  reconstruct_input: false
  decoder_distance: SinkhornLoss
  use_siamese: true
  aggregation: sum
  encoder:
    type: Performer
    n_heads: 1
    n_layers: 2
    d_model: 32
    feed_forward_hidden_dim: 128
batch_size: 64
learning_rate: 0.0001
debug_mode: true
loss_function: mse_loss
