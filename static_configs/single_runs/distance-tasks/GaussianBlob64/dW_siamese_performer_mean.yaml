task:
  type: WassersteinDistanceTask
  dataset: GaussianBlobs
  dataset_config:
    length: 100
    dim: 64
    min_points: 50
    max_points: 100
    centers: 4
  ood_dataset: GaussianBlobs
  ood_config:
    length: 10
    dim: 64
    min_points: 150
    max_points: 200
    centers: 4
backbone:
  type: CoupledNetwork
  latent_dimension: 32
  p: 1
  reconstruct_input: false
  decoder_distance: SinkhornLoss
  use_siamese: true
  aggregation: mean
  encoder:
    type: Performer
    n_heads: 2
    n_layers: 3
    d_model: 64
    feed_forward_hidden_dim: 128
  positional_encoding: SinusoidalAbsolutePositionalEncoding
batch_size: 128
learning_rate: 0.0001
debug_mode: true
loss_function: mse_loss
