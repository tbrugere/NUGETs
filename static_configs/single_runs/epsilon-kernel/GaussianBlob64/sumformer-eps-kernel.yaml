task:
  type: EpsilonKernelTask
  dataset: GaussianBlobs
  task_parameters:
    kernel_size: 10
  dataset_config:
    length: 1000
    min_points: 100
    max_points: 150
    centers: 4
    dim: 64
  ood_dataset: GaussianBlobs
  ood_config:
    length: 100
    min_points: 100
    max_points: 150
    centers: 4
    dim: 64
backbone:
  type: Sumformer
  n_heads: 1
  n_layers: 3
  d_model: 64
  feed_forward_hidden_dim: 128
batch_size: 128
learning_rate: 1.e-4
loss_function: directional_width_loss
aggregation: mean
